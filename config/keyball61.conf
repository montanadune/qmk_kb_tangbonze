CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32


# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_NEWLIB_LIBC=y


# スプリット（分割通信）とその関連サブシステムを完全に停止する
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# 警告が出ているスプリット用のバッテリー同期・イベントリレーをすべて明示的に停止
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_RELAY_EVENT=n

# 【重要】Kconfigの警告が発生しても、ビルドを強制終了させずに続行する
CONFIG_KCONFIG_WARN_AS_ERROR=n
