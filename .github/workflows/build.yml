name: Build ZMK Firmware (Right Hand Single)
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Initialize local west workspace
        run: |
          pip3 install west
          west init -l config
          west update
          west zephyr-export

      - name: Build firmware using Docker
        run: |
          # 環境変数 ZEPHYR_BASE を明示的に指定して Docker 内の west にビルドさせます
          docker run --rm -v "$(pwd):/workspace" -e ZEPHYR_BASE=/workspace/modules/zephyr -w /workspace zmkfirmware/zmk-build-arm:stable \
            west build -s modules/app -d build/keyball61_right -b nice_nano_v2 -- -DSHIELD=keyball61_right -DZMK_CONFIG=/workspace/config

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_right_firmware
          path: build/keyball61_right/zephyr/zmk.uf2
