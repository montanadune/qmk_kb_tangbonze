name: Build ZMK Firmware (Right Hand Single)
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Initialize local west workspace
        run: |
          pip3 install west
          # ワークスペースを初期化
          west init -l config
          # 【修正】makeを使わず、直接westコマンドで依存関係（cormoran/zmk等）を100%確実にダウンロードします
          west update
          west zephyr-export

      - name: Build firmware using Docker
        run: |
          # フォルダパスを現在の構造（modules以下に展開されたZMKアプリ）に適合させてコンパイルを強制実行
          docker run --rm -v "$(pwd):/workspace" -w /workspace zmkfirmware/zmk-build-arm:stable \
            west build -s modules/app -d build/keyball61_right -b nice_nano_v2 -- -DSHIELD=keyball61_right -DZMK_CONFIG=/workspace/config

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_right_firmware
          path: build/keyball61_right/zephyr/zmk.uf2
