name: Build ZMK Firmware (Right Hand Single)
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Build firmware using Docker
        run: |
          # コンテナ内の独立したクリーン環境下で、直接ワークスペース初期化とコンパイルを実行
          docker run --rm -v "$(pwd):/workspace" -w /workspace zmkfirmware/zmk-build-arm:stable /bin/bash -c "
            pip3 install west &&
            west init -l config &&
            west update &&
            west zephyr-export &&
            west build -s modules/app -d build/keyball61_right -b nice_nano_v2 -- -DSHIELD=keyball61_right -DZMK_CONFIG=/workspace/config
          "

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_right_firmware
          path: build/keyball61_right/zephyr/zmk.uf2
